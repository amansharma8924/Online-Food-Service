{% load static %}

<!-- navbar start -->
<div class="row">
    <div class="col-sm-12">
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'index' %}"><img src="{% static 'images/icon.png' %}" alt="" height="50px"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'about' %}">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'product' %}">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'register' %}">Register</a>
                        </li>

                        {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'user' %}">My Account</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'logout' %}">Logout</a>
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'login' %}">Login</a>
                        </li>
                        {% endif %}

                    </ul>
                    <div class="">
                        {% if user.is_authenticated %}
                        <form action="{% url 'mycart' %}">
                    <button type="submit" class="btn btn-dark position-relative">
                        <i class="fa fa-shopping-cart large" aria-hidden="true"></i>
                         {% if request.session.cart > 0 %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        {{request.session.cart}}
    <span class="visually-hidden">unread messages</span>
                            {% endif %}

  </span>
                    </button>
                        </form>
                        {% endif %}
                </div>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success bg-info active" type="submit">Search</button>
                </form>


            </div>
    </div>
    </nav>
</div>
</div>
<!-- navbar end -->
